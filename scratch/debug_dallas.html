<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Debug Dallas</title>
</head>
<body style="background:#0f172a; color:#fff; font-family:sans-serif; padding:20px;">
  <pre id="logs"></pre>
  <iframe id="f" src="../travel_dashboard.html" style="width:100px; height:100px; display:none;"></iframe>
  <script>
    const logEl = document.getElementById('logs');
    function log(msg) {
      logEl.innerText += msg + '\n';
      console.log(msg);
    }

    window.onload = () => {
      setTimeout(async () => {
        const frame = document.getElementById('f');
        const win = frame.contentWindow;
        const doc = win.document;

        log("1. Setting inputs...");
        doc.getElementById('destInput').value = 'Dallas';
        doc.getElementById('minPriceInput').value = '40';
        doc.getElementById('minPriceRange').value = '40';
        doc.getElementById('maxPriceInput').value = '180';
        doc.getElementById('maxPriceRange').value = '180';
        doc.getElementById('distInput').value = '5.0';
        doc.getElementById('distRange').value = '5.0';
        doc.getElementById('guestsInput').value = '2';

        log("2. Calling searchLiveAccommodations('Dallas')...");
        try {
          await win.searchLiveAccommodations('Dallas');
          log("3. Search completed.");
        } catch(e) {
          log("ERROR in search: " + e.message + "\n" + e.stack);
        }

        const cards = doc.querySelectorAll('#liveAccommodationsGrid [data-card-price]');
        log("4. Cards found in DOM: " + cards.length);
        const gridHtml = doc.getElementById('liveAccommodationsGrid').innerHTML;
        log("5. Grid HTML preview: " + gridHtml.substring(0, 300));
        
        log("6. LIVE_HOTELS_CACHE for dallas: " + JSON.stringify(win.LIVE_HOTELS_CACHE['dallas'] || []));
        log("7. CITY_CENTERS for dallas: " + JSON.stringify(win.CITY_CENTERS['dallas'] || null));
      }, 1000);
    };
  </script>
</body>
</html>
