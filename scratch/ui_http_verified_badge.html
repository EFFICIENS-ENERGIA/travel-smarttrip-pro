<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge Interactif Santé HTTP & Transparence Tarifaire</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }

    .hotel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .hotel-name { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .hotel-loc { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    /* Badge d'intégrité HTTP */
    .http-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: help;
      position: relative;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .card-body { padding: 20px; }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .price-val { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
    .price-sub { font-size: 0.85rem; color: var(--text-muted); }

    .card-footer {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.5);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-ota {
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-ota:hover { background: #0284c7; }
  </style>
</head>
<body>

  <article class="hotel-card">
    <div class="card-header">
      <div>
        <h3 class="hotel-name">Hotel Duomo Milano</h3>
        <p class="hotel-loc">📍 Milan Centre historique (0,3 km de la cathédrale)</p>
      </div>
      <div class="http-badge" title="Lien testé en temps réel. Code HTTP 200 OK reçu en 142ms. Zéro redirection parasite.">
        <span class="status-dot"></span>
        <span>HTTP 200 OK (142ms)</span>
      </div>
    </div>

    <div class="card-body">
      <div class="price-row">
        <div>
          <span class="price-val">120,00 €</span>
          <span class="price-sub">/ nuit</span>
        </div>
        <div style="font-size: 0.85rem; color: var(--success);">
          ✓ Sous votre budget (150 €)
        </div>
      </div>
      <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;">
        Tarif direct sans frais cachés. Annulation gratuite jusqu'à 48h avant l'arrivée.
      </p>
    </div>

    <div class="card-footer">
      <span style="font-size: 0.75rem; color: var(--text-muted);">
        🔒 Redirection sécurisée
      </span>
      <a href="https://www.google.com/travel/hotels?q=Duomo%20Milano&hl=fr" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="btn-ota">
        Voir l'Offre
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </a>
    </div>
  </article>

</body>
</html>
