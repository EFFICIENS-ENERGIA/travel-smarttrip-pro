<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Banc d'Essai AUD : Partage Dynamique, Export PDF & Déploiement Multi-Cloud</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; }
    h1 { color: #38bdf8; font-size: 20px; margin-bottom: 8px; }
    pre { background: #020617; border: 1px solid #1e293b; padding: 14px; border-radius: 10px; font-size: 11px; color: #e2e8f0; line-height: 1.5; max-height: 380px; overflow-y: auto; }
    .status-box { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🧪 Banc d'Essai AUD : Partage 1-Clic, Export PDF & Déploiement Multi-Cloud</h1>
  <pre id="output"></pre>
  
  <div id="testStatus" class="status-box">Initialisation des tests...</div>

  <iframe id="dashFrame" src="file:///C:/Users/EFFICIENS%20ENERGIA/.gemini/antigravity/brain/f076e0be-08ee-48cc-9303-5a3edb1e0506/travel_dashboard.html" style="width: 1200px; height: 850px; border: 2px solid #334155; border-radius: 12px; margin-top: 15px; background: white;"></iframe>

  <script>
    const frame = document.getElementById('dashFrame');
    const out = document.getElementById('output');
    const statusBox = document.getElementById('testStatus');
    const log = (msg) => { out.textContent += msg + '\n'; };

    frame.onload = async function() {
      setTimeout(async function() {
        try {
          const win = frame.contentWindow;
          const doc = frame.contentDocument;

          log("==========================================================================");
          log(" BANC D'ESSAI AUD CERTIFIÉ : PARTAGE 1-CLIC, EXPORT PDF & DÉPLOIEMENT CLOUD");
          log("==========================================================================");

          let allTestsPassed = true;

          // ----------------------------------------------------------------------
          // TEST 1 : Présence et ergonomie des boutons d'action dans le Header
          // ----------------------------------------------------------------------
          log("\n--- TEST 1 : Boutons d'Action & UI de Partage/Export ---");
          const btnShareLink = doc.getElementById('btnShareLink');
          const btnShareWhatsApp = doc.getElementById('btnShareWhatsApp');
          const btnOpenSummary = doc.getElementById('btnOpenSummaryModal');
          const headerStayBadge = doc.getElementById('headerStayBadge');

          const hasBtnShare = !!btnShareLink;
          const hasBtnWa = !!btnShareWhatsApp;
          const hasBtnSummary = !!btnOpenSummary;
          const hasBadge = !!headerStayBadge;

          log(`Bouton 'Copier le lien' (#btnShareLink) : ${hasBtnShare ? 'Présent ✅' : 'ÉCHEC ❌'}`);
          log(`Bouton 'WhatsApp' (#btnShareWhatsApp) : ${hasBtnWa ? 'Présent ✅' : 'ÉCHEC ❌'}`);
          log(`Bouton 'Fiche PDF' (#btnOpenSummaryModal) : ${hasBtnSummary ? 'Présent ✅' : 'ÉCHEC ❌'}`);
          log(`Badge durée séjour (#headerStayBadge) : ${hasBadge ? 'Présent ✅' : 'ÉCHEC ❌'}`);

          const test1Ok = hasBtnShare && hasBtnWa && hasBtnSummary && hasBadge;
          if (!test1Ok) allTestsPassed = false;
          log(`Résultat Test 1 (Boutons UI) : ${test1Ok ? 'RÉUSSI (4/4) ✅' : 'ÉCHEC ❌'}`);

          // ----------------------------------------------------------------------
          // TEST 2 : Moteur de Génération d'URL Dynamique & Partageable
          // ----------------------------------------------------------------------
          log("\n--- TEST 2 : Moteur de Génération d'URL avec Tous les Filtres ---");
          doc.getElementById('destInput').value = 'Madrid';
          doc.getElementById('checkInInput').value = '2026-10-01';
          doc.getElementById('checkOutInput').value = '2026-10-06';
          doc.getElementById('guestsInput').value = '4';
          doc.getElementById('minPriceInput').value = '60';
          doc.getElementById('maxPriceInput').value = '220';
          doc.getElementById('landmarkInput').value = 'Bernabeu';
          doc.getElementById('distInput').value = '2.5';
          if (typeof win.setUserCurrency === 'function') {
            win.setUserCurrency('EUR');
          }

          const shareUrl = win.generateShareableUrl();
          log(`URL Générée : ${shareUrl}`);

          const hasDestParam = shareUrl.includes('dest=Madrid');
          const hasCiParam = shareUrl.includes('ci=2026-10-01');
          const hasCoParam = shareUrl.includes('co=2026-10-06');
          const hasGParam = shareUrl.includes('g=4');
          const hasMinParam = shareUrl.includes('min=60');
          const hasMaxParam = shareUrl.includes('max=220');
          const hasLmParam = shareUrl.includes('lm=Bernabeu');
          const hasDistParam = shareUrl.includes('dist=2.5');

          log(`Paramètre dest=Madrid : ${hasDestParam ? 'OK ✅' : 'ÉCHEC ❌'}`);
          log(`Paramètre dates 2026-10-01 / 2026-10-06 : ${hasCiParam && hasCoParam ? 'OK ✅' : 'ÉCHEC ❌'}`);
          log(`Paramètre voyageurs g=4 : ${hasGParam ? 'OK ✅' : 'ÉCHEC ❌'}`);
          log(`Paramètre budget min=60 & max=220 : ${hasMinParam && hasMaxParam ? 'OK ✅' : 'ÉCHEC ❌'}`);
          log(`Paramètre repère lm=Bernabeu & dist=2.5 : ${hasLmParam && hasDistParam ? 'OK ✅' : 'ÉCHEC ❌'}`);

          const test2Ok = hasDestParam && hasCiParam && hasCoParam && hasGParam && hasMinParam && hasMaxParam && hasLmParam && hasDistParam;
          if (!test2Ok) allTestsPassed = false;
          log(`Résultat Test 2 (Génération URL) : ${test2Ok ? 'RÉUSSI (8/8 params) ✅' : 'ÉCHEC ❌'}`);

          // ----------------------------------------------------------------------
          // TEST 3 : Partage WhatsApp Direct & Encodage Sûr
          // ----------------------------------------------------------------------
          log("\n--- TEST 3 : Construction du Message WhatsApp ---");
          let openedWaUrl = '';
          const origOpen = win.open;
          win.open = function(url, target, features) {
            openedWaUrl = url;
            return null;
          };

          win.shareOnWhatsApp();
          win.open = origOpen;

          log(`URL WhatsApp interceptée : ${openedWaUrl}`);
          const isWaDomain = openedWaUrl.startsWith('https://api.whatsapp.com/send?text=');
          const decodedWaMsg = decodeURIComponent(openedWaUrl.replace('https://api.whatsapp.com/send?text=', ''));
          log(`Message WhatsApp décodé :\n${decodedWaMsg}`);

          const hasWaDest = decodedWaMsg.includes('Madrid');
          const hasWaDates = decodedWaMsg.includes('oct.');
          const hasWaGuests = decodedWaMsg.includes('4');
          const hasWaBudget = decodedWaMsg.includes('60');
          const hasWaUrl = decodedWaMsg.includes('http') || decodedWaMsg.includes('file:');

          const test3Ok = isWaDomain && hasWaDest && hasWaDates && hasWaGuests && hasWaBudget && hasWaUrl;
          if (!test3Ok) allTestsPassed = false;
          log(`Résultat Test 3 (WhatsApp) : ${test3Ok ? 'RÉUSSI (6/6) ✅' : 'ÉCHEC ❌'}`);

          // ----------------------------------------------------------------------
          // TEST 4 : Modale Récapitulative & Rendu A4/PDF
          // ----------------------------------------------------------------------
          log("\n--- TEST 4 : Modale Récapitulative & Rendu A4 / PDF ---");
          win.openTripSummaryModal();

          const modal = doc.getElementById('tripSummaryModal');
          const modalBody = doc.getElementById('tripSummaryModalBody');

          const isModalVisible = modal && !modal.classList.contains('hidden');
          log(`Visibilité Modale après openTripSummaryModal() : ${isModalVisible ? 'Visible ✅' : 'ÉCHEC ❌'}`);

          const bodyText = modalBody ? modalBody.innerText : '';
          const bodyHtml = modalBody ? modalBody.innerHTML : '';

          const hasModalDest = bodyText.includes('Madrid');
          const hasModalNights = bodyText.includes('5 nuits') || bodyText.includes('5 Nuits') || bodyText.includes('5');
          const hasModalGuests = bodyText.includes('4 personne');
          const hasModalBudget = bodyText.includes('60') && bodyText.includes('220');
          const hasModalLandmark = bodyText.includes('Bernabeu');
          const hasModalTable = bodyHtml.includes('<table') && bodyHtml.includes('Booking.com') && bodyHtml.includes('Google Hotels');
          const tableRowsCount = (bodyHtml.match(/<tr/g) || []).length;

          log(`Destination affichée dans la fiche : ${hasModalDest ? 'Madrid ✅' : 'ÉCHEC ❌'}`);
          log(`Durée et voyageurs dans la fiche : ${hasModalNights && hasModalGuests ? '5 nuits, 4 personnes ✅' : 'ÉCHEC ❌'}`);
          log(`Fourchette de budget affichée : ${hasModalBudget ? '60 € à 220 € ✅' : 'ÉCHEC ❌'}`);
          log(`Repère affiché : ${hasModalLandmark ? 'Bernabeu ✅' : 'ÉCHEC ❌'}`);
          log(`Tableau des 10 comparateurs : ${hasModalTable ? `Présent (${tableRowsCount - 1} plateformes) ✅` : 'ÉCHEC ❌'}`);

          const test4Ok = isModalVisible && hasModalDest && hasModalNights && hasModalGuests && hasModalBudget && hasModalLandmark && hasModalTable;
          if (!test4Ok) allTestsPassed = false;
          log(`Résultat Test 4 (Modale & Fiche) : ${test4Ok ? 'RÉUSSI (7/7) ✅' : 'ÉCHEC ❌'}`);

          // ----------------------------------------------------------------------
          // SYNTHÈSE GLOBALE DU BANC D'ESSAI
          // ----------------------------------------------------------------------
          log("\n==========================================================================");
          if (allTestsPassed) {
            log("🏆 VALIDATION FINALE : TOUS LES TESTS SONT RÉUSSIS (100% CONFORME)");
            log("Le partage en 1 clic, l'URL dynamique, WhatsApp et l'export PDF sont certifiés.");
            statusBox.innerHTML = "✅ <strong>SUCCÈS TOTAL</strong> : 4/4 suites de tests validées avec succès !";
            statusBox.style.borderColor = "#10b981";
            statusBox.style.color = "#34d399";
          } else {
            log("❌ ÉCHEC : Certains tests n'ont pas satisfait aux exigences.");
            statusBox.innerHTML = "❌ <strong>ÉCHEC D'AUDIT</strong> : Veuillez inspecter les logs.";
            statusBox.style.borderColor = "#ef4444";
            statusBox.style.color = "#f87171";
          }
          log("==========================================================================");

        } catch(err) {
          log("ERREUR CRITIQUE DANS LE BANC D'ESSAI : " + err.message + "\n" + err.stack);
          statusBox.innerHTML = "❌ Erreur critique : " + err.message;
        }
      }, 800);
    };
  </script>
</body>
</html>
