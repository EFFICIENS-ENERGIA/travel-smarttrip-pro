<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Banc d'Essai Tri-Pays - Validation Spécifique Seb</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f8fafc; padding: 24px; margin: 0; }
    h1 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
    .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
    .test-box { background: #0f172a; border-radius: 10px; padding: 14px; border: 1px solid #334155; }
    .test-box.pass { border-color: #10b981; }
    .test-box.fail { border-color: #ef4444; background: #450a0a; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
    .badge-pass { background: #065f46; color: #6ee7b7; }
    .badge-fail { background: #991b1b; color: #fca5a5; }
    .stat-val { font-size: 24px; font-weight: 900; color: #10b981; }
    pre { font-size: 11px; color: #94a3b8; overflow-x: auto; margin-top: 6px; background: #020617; padding: 8px; border-radius: 6px; }
    iframe { width: 1px; height: 1px; position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="../travel_dashboard.html"></iframe>

  <h1>🛡️ CERTIFICATION QA : TEST TRI-PAYS (ROME • BARCELONE • MIAMI)</h1>
  <div class="subtitle">Validation automatisée sous Microsoft Edge Headless des 3 scénarios demandés par Seb en conformité stricte avec les Règles 01 à 14.</div>

  <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <div style="font-size:12px; color:#94a3b8; font-weight:bold; text-transform:uppercase;">Statut Global Banc d'Essai</div>
      <div id="globalStatus" class="stat-val">EN COURS D'EXÉCUTION...</div>
    </div>
    <div style="text-align:right;">
      <div id="testCounts" style="font-size:14px; font-weight:bold; color:#cbd5e1;">0 / 0 tests validés</div>
      <div id="timestamp" style="font-size:11px; color:#64748b;"></div>
    </div>
  </div>

  <div id="testsContainer" class="grid"></div>

  <script>
    const frame = document.getElementById('appFrame');
    const results = [];

    frame.onload = () => {
      setTimeout(runScenarios, 1200);
    };

    function assert(id, title, condition, details) {
      results.push({ id, title, pass: !!condition, details });
      renderResults();
    }

    function renderResults() {
      const container = document.getElementById('testsContainer');
      const passCount = results.filter(r => r.pass).length;
      const totalCount = results.length;
      const isAllPass = passCount === totalCount && totalCount > 0;

      document.getElementById('testCounts').innerText = `${passCount} / ${totalCount} tests validés`;
      document.getElementById('timestamp').innerText = new Date().toLocaleTimeString('fr-FR');

      const globalEl = document.getElementById('globalStatus');
      if (isAllPass) {
        globalEl.innerText = `✅ 100% PASS (${passCount}/${totalCount})`;
        globalEl.style.color = '#10b981';
      } else {
        globalEl.innerText = `❌ ${totalCount - passCount} ÉCHEC(S)`;
        globalEl.style.color = '#ef4444';
      }

      container.innerHTML = results.map(r => `
        <div class="test-box ${r.pass ? 'pass' : 'fail'}">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span style="font-weight:bold; font-size:13px; color:#f8fafc;">${r.id}</span>
            <span class="badge ${r.pass ? 'badge-pass' : 'badge-fail'}">${r.pass ? 'PASS' : 'FAIL'}</span>
          </div>
          <div style="font-size:12px; color:#cbd5e1; margin-bottom:4px;">${r.title}</div>
          <pre>${r.details}</pre>
        </div>
      `).join('');
    }

    async function runScenarios() {
      const win = frame.contentWindow;
      const doc = win.document;

      // =========================================================================
      // SCÉNARIO 1 : ROME (Italie) - 3 personnes, max 60 €/nuit, rayon 4.0 km
      // =========================================================================
      doc.getElementById('destInput').value = 'Rome';
      doc.getElementById('minPriceInput').value = '0';
      doc.getElementById('maxPriceInput').value = '60';
      doc.getElementById('maxPriceRange').value = '60';
      doc.getElementById('distInput').value = '4.0';
      doc.getElementById('distRange').value = '4.0';
      doc.getElementById('guestsInput').value = '3';
      win.updatePriceBadge();
      win.updateDistanceBadge();
      win.renderPlatformCards();
      await win.searchLiveAccommodations('Rome');

      const romePrices = Array.from(doc.querySelectorAll('#liveAccommodationsGrid [data-card-price]')).map(el => parseInt(el.getAttribute('data-card-price'), 10));
      const romeCount = romePrices.length;
      const romeBudgetOk = romeCount > 0 && romePrices.every(p => p <= 60);

      assert('S1_ROME_BUDGET', 'Rome (3p, max 60€) : 100% des hébergements ≤ 60 € (0 offre hors budget)', romeBudgetOk, `Offres trouvées : ${romeCount} | Tarifs : ${romePrices.join('€, ')}€`);

      const romeLinks = Array.from(doc.querySelectorAll('#liveAccommodationsGrid a[href*="booking.com"]')).map(a => a.href);
      const romeLinksGuestsOk = romeLinks.length > 0 && romeLinks.every(l => l.includes('group_adults=3') && l.includes('no_rooms=2'));
      assert('S1_ROME_OTA_LINKS', 'Rome (3p) : Liens Booking avec group_adults=3 et no_rooms=2', romeLinksGuestsOk, `Échantillon URL : ${romeLinks[0]?.substring(0, 100)}...`);

      // =========================================================================
      // SCÉNARIO 2 : BARCELONE (Espagne) - 2 personnes, max 80 €/nuit, rayon 3.0 km
      // =========================================================================
      doc.getElementById('destInput').value = 'Barcelone';
      doc.getElementById('minPriceInput').value = '0';
      doc.getElementById('maxPriceInput').value = '80';
      doc.getElementById('maxPriceRange').value = '80';
      doc.getElementById('distInput').value = '3.0';
      doc.getElementById('distRange').value = '3.0';
      doc.getElementById('guestsInput').value = '2';
      win.updatePriceBadge();
      win.updateDistanceBadge();
      win.renderPlatformCards();
      await win.searchLiveAccommodations('Barcelone');

      const barcPrices = Array.from(doc.querySelectorAll('#liveAccommodationsGrid [data-card-price]')).map(el => parseInt(el.getAttribute('data-card-price'), 10));
      const barcCount = barcPrices.length;
      const barcBudgetOk = barcCount > 0 && barcPrices.every(p => p <= 80);

      assert('S2_BARCELONE_BUDGET', 'Barcelone (2p, max 80€) : 100% des hébergements ≤ 80 € (0 offre hors budget)', barcBudgetOk, `Offres trouvées : ${barcCount} | Tarifs : ${barcPrices.join('€, ')}€`);

      const barcLinks = Array.from(doc.querySelectorAll('#liveAccommodationsGrid a[href*="booking.com"]')).map(a => a.href);
      const barcLinksGuestsOk = barcLinks.length > 0 && barcLinks.every(l => l.includes('group_adults=2') && l.includes('no_rooms=1'));
      assert('S2_BARCELONE_OTA_LINKS', 'Barcelone (2p) : Liens Booking avec group_adults=2 et no_rooms=1', barcLinksGuestsOk, `Échantillon URL : ${barcLinks[0]?.substring(0, 100)}...`);

      // =========================================================================
      // SCÉNARIO 3 : MIAMI (États-Unis) - 5 personnes, max 110 €/nuit, rayon 3.0 km
      // =========================================================================
      doc.getElementById('destInput').value = 'Miami';
      doc.getElementById('minPriceInput').value = '0';
      doc.getElementById('maxPriceInput').value = '110';
      doc.getElementById('maxPriceRange').value = '110';
      doc.getElementById('distInput').value = '3.0';
      doc.getElementById('distRange').value = '3.0';
      doc.getElementById('guestsInput').value = '5';
      win.updatePriceBadge();
      win.updateDistanceBadge();
      win.renderPlatformCards();
      await win.searchLiveAccommodations('Miami');

      const miamiPrices = Array.from(doc.querySelectorAll('#liveAccommodationsGrid [data-card-price]')).map(el => parseInt(el.getAttribute('data-card-price'), 10));
      const miamiCount = miamiPrices.length;
      const miamiBudgetOk = miamiCount > 0 && miamiPrices.every(p => p <= 110);

      assert('S3_MIAMI_BUDGET', 'Miami (5p, max 110€) : 100% des hébergements ≤ 110 € (0 offre hors budget)', miamiBudgetOk, `Offres trouvées : ${miamiCount} | Tarifs : ${miamiPrices.join('€, ')}€`);

      // Vérification rayon strict pour Miami (hôtels de South Beach à > 7 km strictement exclus)
      const gridText = doc.getElementById('liveAccommodationsGrid').innerText;
      const freehandExcluded = !gridText.includes('Freehand Miami');
      const generatorExcluded = !gridText.includes('Generator Miami');
      assert('S3_MIAMI_RADIUS_EXCLUSION', 'Miami (rayon 3.0 km) : Hôtels hors rayon (> 7 km à South Beach) strictement exclus (Règle 02 & 09)', freehandExcluded && generatorExcluded, `Freehand exclu : ${freehandExcluded}, Generator exclu : ${generatorExcluded}`);

      // Vérification mode Grand Groupe 5 personnes (recommandation villas/logements + 3 chambres)
      const platHtml = doc.getElementById('platformsGrid').innerHTML;
      const hasGroupBanner = platHtml.includes('Grand Groupe Détecté : 5 Voyageurs') && platHtml.includes('3 chambres distinctes');
      assert('S3_MIAMI_GROUP_BANNER', 'Miami (5p) : Bannière Mode Grand Groupe et calcul de 3 chambres distinctes', hasGroupBanner, `Bannière 5 voyageurs présente : ${hasGroupBanner}`);

      const miamiLinks = Array.from(doc.querySelectorAll('#liveAccommodationsGrid a[href*="booking.com"]')).map(a => a.href);
      const miamiLinksGuestsOk = miamiLinks.length > 0 && miamiLinks.every(l => l.includes('group_adults=5') && l.includes('no_rooms=3'));
      assert('S3_MIAMI_OTA_LINKS', 'Miami (5p) : Liens Booking calibrés avec group_adults=5 et no_rooms=3', miamiLinksGuestsOk, `Échantillon URL : ${miamiLinks[0]?.substring(0, 100)}...`);

      // =========================================================================
      // COCKPIT GLOBAL : Méta-recherche 10 comparateurs toujours 100% opérationnelle
      // =========================================================================
      const platCards = doc.querySelectorAll('#platformsGrid [data-platform-card]').length;
      assert('S4_GLOBAL_PLATFORMS_COUNT', 'Cockpit méta-recherche : 10 plateformes officielles toujours opérationnelles', platCards === 10, `Nombre comparateurs : ${platCards}`);

      renderResults();
    }
  </script>
</body>
</html>
